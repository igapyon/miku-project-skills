name: Build And Upload Release Asset

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "GitHub Release tag to attach the skill bundle zip to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag_name, 'v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          java_runtime="$(find skills/igapyon-miku-project/runtime -maxdepth 1 -type f -name 'miku-project-*.jar' ! -name '*-sources.jar' | sort -V | tail -n 1)"
          node_runtime="$(find skills/igapyon-miku-project/runtime -maxdepth 1 -type f -name 'miku-project-*.mjs' | sort -V | tail -n 1)"
          test -n "${java_runtime}"
          test -n "${node_runtime}"
          java -jar "${java_runtime}" --version >/dev/null
          node "${node_runtime}" --version >/dev/null

      - name: Test and build release bundle
        run: npm run build

      - name: Locate release zip
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p \"require('./package.json').version\")"
          source_zip="bundle/miku-project-skills-${package_version}.zip"
          test -s "${source_zip}"
          target_zip="bundle/miku-project-skills-${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}.zip"
          cp "${source_zip}" "${target_zip}"
          echo "zip_path=${target_zip}" >> "$GITHUB_OUTPUT"

      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          files: ${{ steps.locate_zip.outputs.zip_path }}
          draft: false
          prerelease: false
